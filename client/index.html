<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Bombe și Petarde</title>
    <meta name="description" content="Joc multiplayer de Revelion în browser: aruncă-i în aer pe prieteni cu petarde. Până la 6 jucători, intri cu un cod." />
    <meta name="theme-color" content="#0b1026" />
    <!-- Added to the home screen (iPhone has no fullscreen in Safari): opens without browser bars. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Petarde" />
    <!-- Link previews (WhatsApp, Messenger, Discord, X); the absolute domain comes from SITE_URL in vite.config.ts. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bombe și Petarde" />
    <meta property="og:title" content="Bombe și Petarde" />
    <meta property="og:description" content="Hai la bombe! Intră în joc cu codul primit și aruncă-i în aer pe prieteni." />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Bombe și Petarde: trei personaje cu căciulă de Moș Crăciun, petarde și artificii într-o noapte cu zăpadă" />
    <meta property="og:locale" content="ro_RO" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bombe și Petarde" />
    <meta name="twitter:description" content="Hai la bombe! Intră în joc cu codul primit și aruncă-i în aer pe prieteni." />
    <meta name="twitter:image" content="%SITE_URL%/og.png" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <style>
      /* Before the stylesheet arrives: no white flash. The rest is in src/style.css. */
      html, body { margin: 0; height: 100%; background: #0b1026; overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="game"><div id="stage"></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
